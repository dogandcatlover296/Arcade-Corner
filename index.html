
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Classroom</title>
<link rel="icon" href="https://www.gstatic.com/classroom/logo_square_rounded.svg">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(135deg, #11102b, #30216b, #102b52);
}

header { text-align: center; padding: 22px 12px 12px; }
h1 { margin: 0 0 8px; font-size: 34px; }
#clock { margin: 8px; color: #d9d5ff; font-size: 15px; }

.tabs {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 12px;
}

button, .action {
  border: 1px solid #8276ff;
  border-radius: 11px;
  padding: 12px 16px;
  color: white;
  background: #29234e;
  font-size: 15px;
  cursor: pointer;
  text-decoration: none;
}

.tab.active, .action.primary { background: #7057ff; }
.panel { display: none; padding: 8px 12px 18px; }
.panel.active { display: block; }

.toolbar {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 9px;
  margin: 6px auto 12px;
}

.viewer {
  width: 100%;
  height: 68vh;
  min-height: 350px;
  position: relative;
  overflow: hidden;
  border: 2px solid #7767ff;
  border-radius: 14px;
  background: white;
}

.viewer iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: white;
}

.viewer:fullscreen,
.viewer.fallback-fullscreen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  width: 100%;
  height: 100%;
  min-height: 0;
  border: 0;
  border-radius: 0;
  background: white;
}

.viewer:fullscreen iframe,
.viewer.fallback-fullscreen iframe {
  width: 100%;
  height: 100%;
}

.fullscreen-controls { display: none; }

.viewer:fullscreen .fullscreen-controls,
.viewer.fallback-fullscreen .fullscreen-controls {
  display: flex;
  align-items: center;
  gap: 7px;
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10000;
  padding: 5px;
  border-radius: 12px;
  background: rgba(25, 20, 55, 0.88);
  opacity: 0.4;
}

.viewer:fullscreen .fullscreen-controls:focus-within,
.viewer.fallback-fullscreen .fullscreen-controls:focus-within {
  opacity: 1;
}

.logo {
  font-size: 21px;
  padding: 7px;
  border: 0;
  background: transparent;
}

.mini-button, .exit-button {
  padding: 8px 10px;
  font-size: 17px;
  border: 0;
}

.mini-button { background: #7057ff; }
.exit-button { background: #29234e; }

footer {
  padding: 12px;
  text-align: center;
  color: #c8c3f5;
  font-size: 12px;
}

@media (max-width: 600px) {
  h1 { font-size: 29px; }
  .viewer { height: 65vh; }
  button, .action { padding: 11px 13px; }
}
</style>
</head>

<body>
<header>
  <h1>🎮 Arcade Corner</h1>
  <div id="clock">Loading clock...</div>
</header>

<nav class="tabs">
  <button class="tab active" data-panel="fern">🌿 Fern</button>
  <button class="tab" data-panel="secureweb">🌐 SecureWeb</button>
  <button class="tab" data-panel="eaglercraft">⛏️ Eaglercraft</button>
</nav>

<main>
  <section class="panel active" id="fern">
    <div class="toolbar">
      <button class="action primary" onclick="goFullscreen('fernViewer')">⛶ Full Screen</button>
      <button class="action" onclick="refreshSite('fernFrame')">🔄 Refresh</button>
      <a class="action" target="_blank" rel="noopener"
        href="https://d1w7oj52hl4x53.cloudfront.net/search?query=aHR0cHM6Ly9kMXc3b2o1MmhsNHg1My5jbG91ZGZyb250Lm5ldC94N2s5bTJwLmh0bWw%3D&target=aHR0cHM6Ly9kMXc3b2o1MmhsNHg1My5jbG91ZGZyb250Lm5ldC94N2s5bTJwLmh0bWw%3D&directLoad=%221%22">Open Fern ↗</a>
    </div>
    <div class="viewer" id="fernViewer">
      <div class="fullscreen-controls">
        <span class="logo">🎮</span>
        <button class="mini-button" onclick="refreshSite('fernFrame')" title="Refresh">🔄</button>
        <button class="exit-button" onclick="exitFullscreen('fernViewer')" title="Exit full screen">✕</button>
      </div>
      <iframe id="fernFrame"
        src="https://d1w7oj52hl4x53.cloudfront.net/search?query=aHR0cHM6Ly9kMXc3b2o1MmhsNHg1My5jbG91ZGZyb250Lm5ldC94N2s5bTJwLmh0bWw%3D&target=aHR0cHM6Ly9kMXc3b2o1MmhsNHg1My5jbG91ZGZyb250Lm5ldC94N2s5bTJwLmh0bWw%3D&directLoad=%221%22"
        title="Fern" allowfullscreen></iframe>
    </div>
  </section>

  <section class="panel" id="secureweb">
    <div class="toolbar">
      <button class="action primary" onclick="goFullscreen('secureViewer')">⛶ Full Screen</button>
      <button class="action" onclick="refreshSite('secureFrame')">🔄 Refresh</button>
      <a class="action" href="https://securedweb.lol/" target="_blank" rel="noopener">Open SecureWeb ↗</a>
    </div>
    <div class="viewer" id="secureViewer">
      <div class="fullscreen-controls">
        <span class="logo">🎮</span>
        <button class="mini-button" onclick="refreshSite('secureFrame')" title="Refresh">🔄</button>
        <button class="exit-button" onclick="exitFullscreen('secureViewer')" title="Exit full screen">✕</button>
      </div>
      <iframe id="secureFrame" src="https://securedweb.lol/"
        title="SecureWeb" allowfullscreen></iframe>
    </div>
  </section>

  <section class="panel" id="eaglercraft">
    <div class="toolbar">
      <button class="action primary" onclick="goFullscreen('eaglerViewer')">⛶ Full Screen</button>
      <button class="action" onclick="refreshSite('eaglerFrame')">🔄 Refresh</button>
      <a class="action" href="https://eaglercraft.com/play?version=26.2"
        target="_blank" rel="noopener">Open Eaglercraft ↗</a>
    </div>
    <div class="viewer" id="eaglerViewer">
      <div class="fullscreen-controls">
        <span class="logo">🎮</span>
        <button class="mini-button" onclick="refreshSite('eaglerFrame')" title="Refresh">🔄</button>
        <button class="exit-button" onclick="exitFullscreen('eaglerViewer')" title="Exit full screen">✕</button>
      </div>
      <iframe id="eaglerFrame"
        src="https://eaglercraft.com/play?version=26.2"
        title="Eaglercraft" allowfullscreen></iframe>
    </div>
  </section>
</main>

<footer>Arcade Corner • Have fun!</footer>

<script>
function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString([], {
    hour: 'numeric', minute: '2-digit', second: '2-digit'
  });
  const date = now.toLocaleDateString([], {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
  });
  document.getElementById('clock').textContent = time + ' • ' + date;
}

updateClock();
setInterval(updateClock, 1000);

document.querySelectorAll('.tab[data-panel]').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.tab[data-panel]').forEach(tab =>
      tab.classList.remove('active')
    );
    document.querySelectorAll('.panel').forEach(panel =>
      panel.classList.remove('active')
    );
    button.classList.add('active');
    document.getElementById(button.dataset.panel).classList.add('active');
  });
});

function refreshSite(frameId) {
  const frame = document.getElementById(frameId);
  const originalSrc = frame.src;
  frame.src = 'about:blank';
  frame.src = originalSrc;
}

async function goFullscreen(id) {
  const viewer = document.getElementById(id);
  try {
    if (viewer.requestFullscreen) {
      await viewer.requestFullscreen();
    } else if (viewer.webkitRequestFullscreen) {
      viewer.webkitRequestFullscreen();
    } else {
      viewer.classList.add('fallback-fullscreen');
    }
  } catch (error) {
    viewer.classList.add('fallback-fullscreen');
  }
}

async function exitFullscreen(id) {
  const viewer = document.getElementById(id);

  if (viewer.classList.contains('fallback-fullscreen')) {
    viewer.classList.remove('fallback-fullscreen');
    return;
  }

  try {
    if (document.fullscreenElement && document.exitFullscreen) {
      await document.exitFullscreen();
    } else if (document.webkitFullscreenElement &&
               document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    } else {
      viewer.classList.remove('fallback-fullscreen');
    }
  } catch (error) {
    viewer.classList.remove('fallback-fullscreen');
  }
}

document.addEventListener('fullscreenchange', () => {
  document.querySelectorAll('.viewer').forEach(viewer => {
    if (document.fullscreenElement !== viewer) {
      viewer.classList.remove('fallback-fullscreen');
    }
  });
});
</script>
</body>
</html>
