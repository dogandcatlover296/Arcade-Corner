<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Classroom</title>
  <link rel="icon" href="https://www.gstatic.com/classroom/logo_square_rounded.svg">

  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(20, 24, 48, 0.88);
      --line: rgba(255,255,255,0.15);
      --text: #f7f7ff;
      --muted: #c4c7e5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, #583aab 0, transparent 35%),
        radial-gradient(circle at 90% 80%, #154c91 0, transparent 35%),
        linear-gradient(135deg, #10132c, #20224e);
    }

    header {
      padding: 24px 16px 12px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 6vw, 46px);
      letter-spacing: -1px;
    }

    #clock {
      color: var(--muted);
      font-size: 14px;
    }

    main {
      width: min(1200px, 96%);
      margin: 14px auto 24px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    button, .open-link {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 15px;
      color: var(--text);
      background: rgba(255,255,255,0.08);
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    button:hover, .open-link:hover {
      background: rgba(255,255,255,0.18);
    }

    .tab.active {
      background: #7355e8;
      border-color: #a99aff;
    }

    .viewer {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 16px 50px rgba(0,0,0,0.3);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .site-name {
      margin-right: auto;
      font-weight: bold;
    }

    .frame-wrap {
      height: min(72vh, 760px);
      min-height: 420px;
      background: #fff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .hint {
      padding: 10px 14px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 8px 16px 24px;
      font-size: 13px;
    }

    .viewer:fullscreen {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      background: #10132c;
    }

    .viewer:fullscreen .toolbar {
      padding: 8px;
    }

    .viewer:fullscreen .site-name,
    .viewer:fullscreen .open-link,
    .viewer:fullscreen .hint {
      display: none;
    }

    .viewer:fullscreen .frame-wrap {
      height: calc(100vh - 54px);
      min-height: 0;
    }

    @media (max-width: 600px) {
      .frame-wrap {
        height: 68vh;
        min-height: 360px;
      }

      .tabs button {
        flex: 1;
      }

      .toolbar button {
        padding: 10px 12px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🎮 Arcade Corner</h1>
    <div id="clock">Loading time...</div>
  </header>

  <main>
    <nav class="tabs" aria-label="Websites">
      <button class="tab active" data-panel="fern">🌿 Fern</button>
      <button class="tab" data-panel="secureweb">🔒 SecureWeb</button>
      <button class="tab" data-panel="unblocked">❄️ Freeze Nova</button>
    </nav>

    <section class="viewer" id="viewer">
      <div class="toolbar">
        <span class="site-name" id="siteName">Fern</span>
        <button id="refreshBtn" type="button">↻ Refresh</button>
        <a class="open-link" id="openLink"
           href="https://d1w7oj52hl4x53.cloudfront.net/search?query=aHR0cHM6Ly9kMXc3b2o1MmhsNHg1My5jbG91ZGZyb250Lm5ldC94N2s5bTJwLmh0bWw%3D&target=aHR0cHM6Ly9kMXc3b2o1MmhsNHg1My5jbG91ZGZyb250Lm5ldC94N2s5bTJwLmh0bWw%3D&directLoad=%221%22"
           target="_blank" rel="noopener noreferrer">↗ Open link</a>
        <button id="fullscreenBtn" type="button">⛶ Full Screen</button>
        <button id="exitBtn" type="button" aria-label="Exit fullscreen" hidden>✕</button>
      </div>

      <div class="frame-wrap">
        <iframe
          id="siteFrame"
          title="Fern website"
          src="https://d1w7oj52hl4x53.cloudfront.net/search?query=aHR0cHM6Ly9kMXc3b2o1MmhsNHg1My5jbG91ZGZyb250Lm5ldC94N2s5bTJwLmh0bWw%3D&target=aHR0cHM6Ly9kMXc3b2o1MmhsNHg1My5jbG91ZGZyb250Lm5ldC94N2s5bTJwLmh0bWw%3D&directLoad=%221%22"
          allow="fullscreen"
          allowfullscreen
          loading="eager"
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
      </div>

      <div class="hint">
        If a website does not load here, use Open link to try it in a new tab.
      </div>
    </section>
  </main>

  <footer>Arcade Corner • Have fun!</footer>

  <script>
    const sites = {
      fern: {
        name: "Fern",
        url: "https://d1w7oj52hl4x53.cloudfront.net/search?query=aHR0cHM6Ly9kMXc3b2o1MmhsNHg1My5jbG91ZGZyb250Lm5ldC94N2s5bTJwLmh0bWw%3D&target=aHR0cHM6Ly9kMXc3b2o1MmhsNHg1My5jbG91ZGZyb250Lm5ldC94N2s5bTJwLmh0bWw%3D&directLoad=%221%22"
      },
      secureweb: {
        name: "SecureWeb",
        url: "https://securedweb.lol/"
      },
      unblocked: {
        name: "Freeze Nova",
        url: "https://unblocked-games.s3.amazonaws.com/index.html"
      }
    };

    const frame = document.getElementById("siteFrame");
    const viewer = document.getElementById("viewer");
    const siteName = document.getElementById("siteName");
    const openLink = document.getElementById("openLink");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const exitBtn = document.getElementById("exitBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const tabs = document.querySelectorAll(".tab");

    let currentSite = "fern";

    function selectSite(key) {
      const site = sites[key];
      if (!site) return;

      currentSite = key;
      frame.src = site.url;
      frame.title = site.name + " website";
      siteName.textContent = site.name;
      openLink.href = site.url;

      tabs.forEach(tab => {
        const active = tab.dataset.panel === key;
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-pressed", String(active));
      });
    }

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
        selectSite(tab.dataset.panel);
      });
    });

    refreshBtn.addEventListener("click", () => {
      frame.src = sites[currentSite].url;
    });

    fullscreenBtn.addEventListener("click", async () => {
      try {
        await viewer.requestFullscreen();
      } catch {
        alert("Fullscreen isn't available in this browser. Try opening the website in a new tab.");
      }
    });

    exitBtn.addEventListener("click", () => {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    });

    function updateFullscreenControls() {
      const isFullscreen = document.fullscreenElement === viewer;
      fullscreenBtn.hidden = isFullscreen;
      exitBtn.hidden = !isFullscreen;
    }

    document.addEventListener("fullscreenchange", updateFullscreenControls);

    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit"
      });
      const date = now.toLocaleDateString([], {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });
      document.getElementById("clock").textContent = date + " • " + time;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
