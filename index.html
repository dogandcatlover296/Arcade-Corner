<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcade Corner</title>
<style>
:root{--bg:#101218;--panel:#1d2330;--lime:#c5f36b;--muted:#aab2c3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f6f7fb;font:16px system-ui,sans-serif}header,main{max-width:1050px;margin:auto;padding:24px 18px}.brand{font-size:clamp(30px,5vw,44px);font-weight:900}.brand span{color:var(--lime)}p{color:var(--muted)}form{display:flex;gap:8px;max-width:700px}input{flex:1;min-width:0;padding:13px;border-radius:12px;border:0;font-size:16px}button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;background:var(--lime);color:#15190f;font-weight:800}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{background:var(--panel);color:white;border:1px solid #343b4d}.chip.active{background:var(--lime);color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.card{background:var(--panel);border:1px solid #343b4d;border-radius:16px;padding:16px;display:flex;flex-direction:column;min-height:160px}.emoji{font-size:32px}.card h3{margin:8px 0 3px}.card p{font-size:14px;flex:1}.play{width:100%}.overlay{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:12px;z-index:3}.overlay.open{display:flex}.modal{background:var(--panel);padding:18px;border-radius:18px;width:min(700px,100%);max-height:94vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.area{min-height:270px;background:#0b0d12;border-radius:12px;padding:15px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center}.area canvas{max-width:100%;touch-action:manipulation}.score{color:var(--lime);font-weight:800}.tic{display:grid;grid-template-columns:repeat(3,70px);gap:5px}.tic button{height:70px;font-size:28px}.memory{display:grid;grid-template-columns:repeat(4,52px);gap:6px}.memory button{height:52px;font-size:23px;background:#30384a;color:white}.foot{font-size:12px;color:var(--muted)}@media(max-width:500px){form{flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:12px}.tic{grid-template-columns:repeat(3,58px)}.tic button{height:58px}}
</style></head><body>
<header><div class="brand"><span>▶</span> Arcade Corner</div><p>Quick games. Big fun. Pick something and play.</p><form id="search"><input id="q" placeholder="Search Google…" aria-label="Google search"><button>Search Web ↗</button></form><p><a href="https://www.google.com/" target="_blank" rel="noopener noreferrer" style="color:var(--lime);font-weight:800">Open Google ↗</a></p></header>
<main><div class="filters" id="filters"></div><h2>Pick a game</h2><div class="grid" id="games"></div><p class="foot">The 10 mini-games are built into this page, so they do not depend on other game sites loading inside Arcade Corner. The now.gg tile opens the external now.gg site in a new tab. Google opens in a new tab.</p></main>
<div class="overlay" id="overlay"><div class="modal"><div class="modalhead"><h2 id="title"></h2><button id="close">✕</button></div><div class="area" id="area"></div></div></div>
<script>
const list=[
['snake','🐍','Snake','Arcade','Eat dots and avoid crashing.'],
['pong','🏓','Pong','Arcade','Keep the ball in play against the computer.'],
['break','🧱','Brick Bouncer','Arcade','Clear the bricks with your ball.'],
['reaction','⚡','Reaction Test','Skill','Test how fast you can react.'],
['memory','🧠','Memory Match','Puzzle','Find matching pairs.'],
['tic','❎','Tic-Tac-Toe','Puzzle','Play X and O with a friend.'],
['guess','🔢','Number Guess','Puzzle','Guess a number from 1 to 100.'],
['cookie','🍪','Cookie Clicker','Classic','Click cookies and buy helpers.'],
['dodge','☄️','Dodge Drop','Skill','Avoid falling rocks.'],
['rps','✂️','Rock Paper Scissors','Classic','Try to beat the computer.'],
['nowgg','☁️','now.gg Cloud Games','External','Open now.gg to explore its cloud gaming library in a new tab.']];
const cats=['All','Arcade','Puzzle','Skill','Classic','External'];let active='All',timer=null,keydown=null;const $=id=>document.getElementById(id);
$('search').onsubmit=e=>{e.preventDefault();let q=$('q').value.trim();if(q)window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank','noopener,noreferrer')};
cats.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.className='chip'+(c==='All'?' active':'');b.onclick=()=>{active=c;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.textContent===c));render()};$('filters').appendChild(b)});
function render(){$('games').innerHTML='';list.filter(g=>active==='All'||g[3]===active).forEach(g=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="emoji">${g[1]}</div><h3>${g[2]}</h3><p>${g[4]}</p><button class="play">Play Now</button>`;d.querySelector('button').textContent=g[0]==='nowgg'?'Open now.gg ↗':'Play Now';d.querySelector('button').onclick=()=>{if(g[0]==='nowgg'){window.open('https://now.gg/','_blank','noopener,noreferrer');return}open(g[0],g[2])};$('games').appendChild(d)})}render();
function close(){if(timer)clearInterval(timer);if(keydown)document.removeEventListener('keydown',keydown);timer=null;keydown=null;$('overlay').classList.remove('open');$('area').innerHTML=''}
$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};
function open(id,name){close();$('title').textContent=name;$('overlay').classList.add('open');let a=$('area');function node(tag,text,cls){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;a.appendChild(n);return n}function button(text,fn){let b=node('button',text);b.onclick=fn;return b}function score(t){return node('div',t,'score')}function msg(t){node('p',t)}
if(id==='tic'){let vals=Array(9).fill(''),turn='X',s=score('X goes first'),board=node('div',undefined,'tic');function win(){for(let q of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(vals[q[0]]&&vals[q[0]]===vals[q[1]]&&vals[q[1]]===vals[q[2]])return vals[q[0]];return vals.every(Boolean)?'Tie':null}vals.forEach((v,i)=>{let b=document.createElement('button');board.appendChild(b);b.onclick=()=>{if(vals[i]||win())return;vals[i]=turn;b.textContent=turn;let w=win();if(w)s.textContent=w==='Tie'?'Tie game!':w+' wins!';else{turn=turn==='X'?'O':'X';s.textContent=turn+' goes next'}}});button('Restart',()=>open(id,name));return}
if(id==='guess'){let n=1+Math.floor(Math.random()*100),tries=0;msg('Guess the secret number from 1 to 100.');let inp=node('input');inp.type='number';inp.placeholder='Your guess';let s=score('');button('Guess',()=>{let v=+inp.value;if(!v){s.textContent='Type a number first.';return}tries++;s.textContent=v===n?'Correct in '+tries+' guesses! 🎉':v<n?'Too low!':'Too high!'});button('New number',()=>open(id,name));return}
if(id==='cookie'){let n=0,per=1,cost=10,s=score('Cookies: 0');button('🍪 Click for cookies!',()=>{n+=per;s.textContent='Cookies: '+n+' (+'+per+' per click)'});button('Buy helper (10 cookies)',()=>{if(n>=cost){n-=cost;per++;cost=Math.ceil(cost*1.7);s.textContent='Cookies: '+n+' (+'+per+' per click)'}else s.textContent='Need more cookies!'});return}
if(id==='rps'){let s=score('Choose a move!');['Rock','Paper','Scissors'].forEach(m=>button(m,()=>{let c=['Rock','Paper','Scissors'][Math.floor(Math.random()*3)],w=m===c?'Tie!':((m==='Rock'&&c==='Scissors')||(m==='Paper'&&c==='Rock')||(m==='Scissors'&&c==='Paper'))?'You win!':'Computer wins!';s.textContent=`You: ${m} · Computer: ${c} · ${w}`}));return}
if(id==='memory'){let vals=['🐸','🚀','🍕','🐱','⚽','🌈','🦄','🎮','🐸','🚀','🍕','🐱','⚽','🌈','🦄','🎮'].sort(()=>Math.random()-.5),opened=[],found=new Set(),moves=0,s=score('Moves: 0'),board=node('div',undefined,'memory');vals.forEach((v,i)=>{let b=document.createElement('button');b.textContent='?';board.appendChild(b);b.onclick=()=>{if(found.has(i)||opened.includes(i)||opened.length===2)return;b.textContent=v;opened.push(i);if(opened.length===2){moves++;s.textContent='Moves: '+moves;if(vals[opened[0]]===vals[opened[1]]){opened.forEach(n=>found.add(n));opened=[];if(found.size===vals.length)s.textContent='You matched them all! 🎉'}else setTimeout(()=>{opened.forEach(n=>board.children[n].textContent='?');opened=[]},600)}}});return}
if(id==='reaction'){let state='wait',start=0,delay;let b=button('Wait for green...',()=>{if(state==='wait'){clearTimeout(delay);state='early';b.textContent='Too soon! Tap to retry'}else if(state==='go'){b.textContent='Reaction: '+Math.round(performance.now()-start)+' ms';state='done'}else{close();open(id,name)}});b.style.minHeight='100px';b.style.fontSize='22px';msg('Wait for the button to turn green, then tap it fast.');delay=setTimeout(()=>{if(state==='wait'){state='go';start=performance.now();b.style.background='#35df8b';b.textContent='TAP NOW!'}},1200+Math.random()*2500);return}
if(id==='snake'){let c=node('canvas');c.width=360;c.height=270;let x=c.getContext('2d'),s=[{x:8,y:7},{x:7,y:7}],d={x:1,y:0},f={x:12,y:7},pts=0,alive=true,sc=score('Score: 0');msg('Use arrow keys or buttons below.');let controls=node('div');[['⬆️',0,-1],['⬅️',-1,0],['⬇️',0,1],['➡️',1,0]].forEach(([t,dx,dy])=>button(t,()=>{if(dx!==-d.x||dy!==-d.y)d={x:dx,y:dy}}));keydown=e=>{let m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m&&(m[0]!==-d.x||m[1]!==-d.y)){d={x:m[0],y:m[1]};e.preventDefault()}};document.addEventListener('keydown',keydown);function tick(){if(!alive)return;let h={x:s[0].x+d.x,y:s[0].y+d.y};if(h.x<0||h.y<0||h.x>=20||h.y>=15||s.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(timer);sc.textContent='Game over! Score: '+pts;button('Play again',()=>open(id,name));return}s.unshift(h);if(h.x===f.x&&h.y===f.y){pts++;sc.textContent='Score: '+pts;f={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*15)}}else s.pop();x.fillStyle='#090c11';x.fillRect(0,0,360,270);x.fillStyle='#c5f36b';s.forEach(p=>x.fillRect(p.x*18+1,p.y*18+1,16,16));x.fillStyle='#ff6978';x.fillRect(f.x*18+3,f.y*18+3,12,12)}timer=setInterval(tick,125);return}
if(id==='pong'||id==='break'||id==='dodge'){let c=node('canvas');c.width=420;c.height=270;let x=c.getContext('2d'),p=180,bx=210,by=130,vx=3,vy=3,pts=0,rocks=[];let sc=score('Score: 0');msg(id==='pong'?'Move your mouse to control the paddle.':id==='break'?'Move the paddle and bounce the ball into the bricks.':'Move your mouse left and right to dodge falling rocks.');c.onmousemove=e=>{let r=c.getBoundingClientRect();p=(e.clientX-r.left)*c.width/r.width-35};keydown=e=>{if(e.key==='ArrowLeft')p-=20;if(e.key==='ArrowRight')p+=20};document.addEventListener('keydown',keydown);let bricks=[];for(let r=0;r<3;r++)for(let j=0;j<7;j++)bricks.push({x:8+j*58,y:15+r*20,on:true});function tick(){x.fillStyle='#090c11';x.fillRect(0,0,420,270);p=Math.max(0,Math.min(350,p));if(id==='dodge'){if(Math.random()<.06)rocks.push({x:Math.random()*405,y:-10});rocks.forEach(r=>r.y+=3);x.fillStyle='#ff6978';rocks.forEach(r=>x.fillRect(r.x,r.y,12,12));x.fillStyle='#c5f36b';x.fillRect(p,240,35,18);pts++;if(rocks.some(r=>r.y>230&&r.y<260&&Math.abs(r.x-p)<28)){clearInterval(timer);sc.textContent='Game over! Score: '+pts;button('Play again',()=>open(id,name));return}}else{bx+=vx;by+=vy;if(bx<5||bx>415)vx*=-1;if(by<5)vy*=-1;if(by>235&&bx>p&&bx<p+70)vy=-Math.abs(vy);if(id==='break'){bricks.forEach(b=>{if(b.on&&bx>b.x&&bx<b.x+50&&by>b.y&&by<b.y+14){b.on=false;vy*=-1;pts++;sc.textContent='Bricks: '+pts}});x.fillStyle='#65d6ff';bricks.forEach(b=>{if(b.on)x.fillRect(b.x,b.y,50,14)});if(bricks.every(b=>!b.on)){clearInterval(timer);sc.textContent='You cleared the bricks! 🎉';button('Play again',()=>open(id,name));return}}else if(bx<10||bx>410){pts++;sc.textContent='Hits: '+pts;bx=210;by=130;vx*=-1}x.fillStyle='#c5f36b';x.fillRect(p,245,70,8);x.beginPath();x.arc(bx,by,6,0,7);x.fill()}}timer=setInterval(tick,25);return}
}
</script></body></html>
