
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Classroom</title>
<link rel="icon" href="https://www.gstatic.com/classroom/logo_square_rounded.svg">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(135deg, #11102b, #30216b, #102b52);
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 22px 12px 12px;
}

h1 {
  margin: 0 0 8px;
  font-size: 34px;
}

#clock {
  font-size: 17px;
  color: #d9d5ff;
  margin: 8px;
}

.tabs {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 12px;
}

.tab {
  border: 1px solid #8276ff;
  background: #27204c;
  color: white;
  border-radius: 12px;
  padding: 12px 22px;
  font-size: 16px;
  cursor: pointer;
}

.tab.active {
  background: #7057ff;
}

.panel {
  display: none;
  padding: 8px 12px 18px;
}

.panel.active {
  display: block;
}

.toolbar {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 6px auto 12px;
}

.action {
  display: inline-block;
  border: none;
  border-radius: 10px;
  background: #7057ff;
  color: white;
  padding: 12px 16px;
  font-size: 15px;
  text-decoration: none;
  cursor: pointer;
}

.action.secondary {
  background: #29234e;
  border: 1px solid #8276ff;
}

.viewer {
  width: 100%;
  height: 68vh;
  min-height: 350px;
  border: 2px solid #7767ff;
  border-radius: 14px;
  overflow: hidden;
  background: white;
}

.viewer iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: white;
}

/* Full-screen viewer */
.viewer:fullscreen {
  width: 100%;
  height: 100%;
  min-height: 0;
  border: 0;
  border-radius: 0;
  background: white;
}

.viewer:fullscreen iframe {
  width: 100%;
  height: 100%;
}

.fullscreen-exit {
  display: none;
}

.viewer:fullscreen .fullscreen-exit {
  display: block;
  position: absolute;
  z-index: 10;
  top: 12px;
  right: 12px;
}

footer {
  text-align: center;
  color: #c8c3f5;
  padding: 12px;
  font-size: 12px;
}

@media (max-width: 600px) {
  h1 { font-size: 29px; }
  .viewer { height: 65vh; }
  .tab { padding: 11px 18px; }
}

/* iPhone Safari fallback when native fullscreen isn't available */
.viewer.fallback-fullscreen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  width: 100%;
  height: 100%;
  min-height: 0;
  border: 0;
  border-radius: 0;
  background: white;
}

.viewer.fallback-fullscreen iframe {
  height: 100%;
  width: 100%;
}

.viewer.fallback-fullscreen .fullscreen-exit {
  display: block;
  position: absolute;
  z-index: 10;
  top: 12px;
  right: 12px;
}
</style>
</head>

<body>
<header>
  <h1>🎮 Arcade Corner</h1>
  <div id="clock">Loading clock...</div>
</header>

<nav class="tabs">
  <button class="tab active" data-panel="fern">🌿 Fern</button>
  <button class="tab" data-panel="secureweb">🌐 SecureWeb</button>
</nav>

<main>
  <section class="panel active" id="fern">
    <div class="toolbar">
      <button class="action" onclick="goFullscreen('fernViewer')">
        ⛶ Full Screen
      </button>
      <a class="action secondary"
         href="https://d1w7oj52hl4x53.cloudfront.net/search?query=aHR0cHM6Ly9kMXc3b2o1MmhsNHg1My5jbG91ZGZyb250Lm5ldC94N2s5bTJwLmh0bWw%3D&target=aHR0cHM6Ly9kMXc3b2o1MmhsNHg1My5jbG91ZGZyb250Lm5ldC94N2s5bTJwLmh0bWw%3D&directLoad=%221%22"
         target="_blank" rel="noopener">
        Open Fern ↗
      </a>
    </div>

    <div class="viewer" id="fernViewer">
      <button class="action fullscreen-exit"
              onclick="exitFullscreen('fernViewer')">
        ✕ Exit Full Screen
      </button>
      <iframe
        src="https://d1w7oj52hl4x53.cloudfront.net/search?query=aHR0cHM6Ly9kMXc3b2o1MmhsNHg1My5jbG91ZGZyb250Lm5ldC94N2s5bTJwLmh0bWw%3D&target=aHR0cHM6Ly9kMXc3b2o1MmhsNHg1My5jbG91ZGZyb250Lm5ldC94N2s5bTJwLmh0bWw%3D&directLoad=%221%22"
        title="Fern" allowfullscreen>
      </iframe>
    </div>
  </section>

  <section class="panel" id="secureweb">
    <div class="toolbar">
      <button class="action" onclick="goFullscreen('secureViewer')">
        ⛶ Full Screen
      </button>
      <a class="action secondary"
         href="https://securedweb.lol/"
         target="_blank" rel="noopener">
        Open SecureWeb ↗
      </a>
    </div>

    <div class="viewer" id="secureViewer">
      <button class="action fullscreen-exit"
              onclick="exitFullscreen('secureViewer')">
        ✕ Exit Full Screen
      </button>
      <iframe
        src="https://securedweb.lol/"
        title="SecureWeb" allowfullscreen>
      </iframe>
    </div>
  </section>
</main>

<footer>Arcade Corner • Have fun!</footer>

<script>
function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString([], {
    hour: 'numeric',
    minute: '2-digit',
    second: '2-digit'
  });
  const date = now.toLocaleDateString([], {
    weekday: 'long',
    month: 'long',
    day: 'numeric',
    year: 'numeric'
  });
  document.getElementById('clock').textContent = time + ' • ' + date;
}

updateClock();
setInterval(updateClock, 1000);

document.querySelectorAll('.tab').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(tab => {
      tab.classList.remove('active');
    });
    document.querySelectorAll('.panel').forEach(panel => {
      panel.classList.remove('active');
    });

    button.classList.add('active');
    document.getElementById(button.dataset.panel).classList.add('active');
  });
});

async function goFullscreen(id) {
  const viewer = document.getElementById(id);

  try {
    if (viewer.requestFullscreen) {
      await viewer.requestFullscreen();
    } else if (viewer.webkitRequestFullscreen) {
      viewer.webkitRequestFullscreen();
    } else {
      viewer.classList.add('fallback-fullscreen');
    }
  } catch (error) {
    viewer.classList.add('fallback-fullscreen');
  }
}

async function exitFullscreen(id) {
  const viewer = document.getElementById(id);

  if (viewer.classList.contains('fallback-fullscreen')) {
    viewer.classList.remove('fallback-fullscreen');
    return;
  }

  try {
    if (document.fullscreenElement && document.exitFullscreen) {
      await document.exitFullscreen();
    } else if (document.webkitFullscreenElement &&
               document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    } else {
      viewer.classList.remove('fallback-fullscreen');
    }
  } catch (error) {
    viewer.classList.remove('fallback-fullscreen');
  }
}

document.addEventListener('fullscreenchange', () => {
  document.querySelectorAll('.viewer').forEach(viewer => {
    if (document.fullscreenElement !== viewer) {
      viewer.classList.remove('fallback-fullscreen');
    }
  });
});
</script>
</body>
</html>
