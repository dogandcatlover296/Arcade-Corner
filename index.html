<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Google Classroom</title>
<link rel="icon" href="https://www.gstatic.com/classroom/logo_square_rounded.svg">

<style>
:root {
  --text: #fff;
  --muted: #c9c9e8;
  --border: rgba(255,255,255,.16);
}
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at top left, #5940a7, transparent 45%),
    radial-gradient(ellipse at bottom right, #164b85, transparent 45%),
    #10132b;
}

header { text-align: center; padding: 22px 12px 16px; }
h1 { margin: 0 0 8px; font-size: clamp(30px, 7vw, 44px); }
#clock { color: var(--muted); font-size: 13px; }

main { width: 96%; max-width: 1250px; margin: 0 auto 22px; }

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

button, .open-link {
  font: bold 14px Arial, sans-serif;
  color: white;
  background: rgba(255,255,255,.09);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 11px 14px;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:active, .open-link:active { background: #5141a4; }
.tab.active { background: #7154dc; border-color: #b7a5ff; }

.viewer {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: rgba(15,19,45,.94);
  box-shadow: 0 15px 40px rgba(0,0,0,.3);
}

.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px;
  border-bottom: 1px solid var(--border);
}

.site-name { font-weight: bold; margin-right: auto; }

.frame-wrap {
  width: 100%;
  height: 72vh;
  min-height: 380px;
  background: white;
}

iframe {
  width: 100%;
  height: 100%;
  display: block;
  border: 0;
  background: white;
}

.hint {
  padding: 10px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}

footer {
  padding: 8px 12px 24px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

.viewer:fullscreen {
  width: 100%;
  height: 100%;
  border: 0;
  border-radius: 0;
  background: #10132b;
}
.viewer:fullscreen .frame-wrap {
  height: calc(100vh - 54px);
  min-height: 0;
}
.viewer:fullscreen .site-name,
.viewer:fullscreen .open-link,
.viewer:fullscreen .hint { display: none; }

body.fallback-fullscreen { overflow: hidden; }
body.fallback-fullscreen header,
body.fallback-fullscreen main > .tabs,
body.fallback-fullscreen footer { display: none; }

body.fallback-fullscreen main {
  position: fixed;
  inset: 0;
  z-index: 9999;
  width: 100%;
  height: 100%;
  margin: 0;
}
body.fallback-fullscreen .viewer {
  width: 100%;
  height: 100%;
  border: 0;
  border-radius: 0;
}
body.fallback-fullscreen .toolbar { min-height: 48px; padding: 6px; }
body.fallback-fullscreen .site-name,
body.fallback-fullscreen .open-link,
body.fallback-fullscreen .hint { display: none; }
body.fallback-fullscreen .frame-wrap {
  height: calc(100% - 48px);
  min-height: 0;
}

[hidden] { display: none !important; }

@media (max-width: 600px) {
  .tabs button { flex: 1; padding: 12px 8px; }
  .toolbar button { padding: 10px; }
  .frame-wrap { height: 70vh; min-height: 350px; }
}
</style>
</head>

<body>
<header>
  <h1>🎮 Arcade Corner</h1>
  <div id="clock">Loading time...</div>
</header>

<main>
  <nav class="tabs" aria-label="Websites">
    <button class="tab active" data-panel="fern">🌿 Fern</button>
    <button class="tab" data-panel="secureweb">🔒 SecureWeb</button>
    <button class="tab" data-panel="unblocked">❄️ Freeze Nova</button>
    <button class="tab" data-panel="tiktok">🎵 TikTok</button>
  </nav>

  <section class="viewer" id="viewer">
    <div class="toolbar">
      <span class="site-name" id="siteName">Fern</span>
      <button id="refreshBtn" type="button">↻ Refresh</button>
      <a class="open-link" id="openLink" href="#" target="_blank"
         rel="noopener noreferrer">↗ Open link</a>
      <button id="fullscreenBtn" type="button">⛶ Full Screen</button>
      <button id="exitBtn" type="button" hidden>✕ Exit</button>
    </div>

    <div class="frame-wrap">
      <iframe id="siteFrame" title="Fern website"
        allow="fullscreen"
        allowfullscreen
        loading="eager"></iframe>
    </div>

    <div class="hint" id="hint">
      If a website doesn't load here, try Open link.
    </div>
  </section>
</main>

<footer>Arcade Corner • Have fun!</footer>

<script>
const sites = {
  fern: {
    name: "Fern",
    url: "https://d1w7oj52hl4x53.cloudfront.net/search?query=aHR0cHM6Ly9kMXc3b2o1MmhsNHg1My5jbG91ZGZyb250Lm5ldC94N2s5bTJwLmh0bWw%3D&target=aHR0cHM6Ly9kMXc3b2o1MmhsNHg1My5jbG91ZGZyb250Lm5ldC94N2s5bTJwLmh0bWw%3D&directLoad=%221%22"
  },
  secureweb: {
    name: "SecureWeb",
    url: "https://securedweb.lol/"
  },
  unblocked: {
    name: "Freeze Nova",
    url: "https://unblocked-games.s3.amazonaws.com/index.html"
  },
  tiktok: {
    name: "TikTok",
    url: "https://www.tiktok.com/"
  }
};

const viewer = document.getElementById("viewer");
const frame = document.getElementById("siteFrame");
const siteName = document.getElementById("siteName");
const openLink = document.getElementById("openLink");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const exitBtn = document.getElementById("exitBtn");
const refreshBtn = document.getElementById("refreshBtn");
const hint = document.getElementById("hint");
const tabs = document.querySelectorAll(".tab");

let currentSite = "fern";
let fallbackMode = false;

function selectSite(key) {
  const site = sites[key];
  if (!site) return;

  currentSite = key;
  frame.src = site.url;
  frame.title = site.name + " website";
  siteName.textContent = site.name;
  openLink.href = site.url;

  hint.textContent = key === "tiktok"
    ? "TikTok may block loading inside this panel. If it stays blank, tap Open link."
    : "If a website doesn't load here, try Open link.";

  tabs.forEach(tab => {
    const active = tab.dataset.panel === key;
    tab.classList.toggle("active", active);
    tab.setAttribute("aria-pressed", String(active));
  });
}

function leaveFullscreen() {
  if (document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }

  if (fallbackMode) {
    fallbackMode = false;
    document.body.classList.remove("fallback-fullscreen");
  }

  updateFullscreenButtons();
}

tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    leaveFullscreen();
    selectSite(tab.dataset.panel);
  });
});

refreshBtn.addEventListener("click", () => {
  frame.src = sites[currentSite].url;
});

async function enterFullscreen() {
  if (viewer.requestFullscreen) {
    try {
      await viewer.requestFullscreen();
      return;
    } catch (error) {
      // Use the page-sized fallback below.
    }
  }

  fallbackMode = true;
  document.body.classList.add("fallback-fullscreen");
  updateFullscreenButtons();
}

fullscreenBtn.addEventListener("click", enterFullscreen);
exitBtn.addEventListener("click", leaveFullscreen);

document.addEventListener("fullscreenchange", updateFullscreenButtons);

function updateFullscreenButtons() {
  const active = document.fullscreenElement === viewer || fallbackMode;
  fullscreenBtn.hidden = active;
  exitBtn.hidden = !active;
}

function updateClock() {
  const now = new Date();
  const date = now.toLocaleDateString([], {
    weekday: "long",
    month: "long",
    day: "numeric",
    year: "numeric"
  });
  const time = now.toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit",
    second: "2-digit"
  });

  document.getElementById("clock").textContent = date + " • " + time;
}

selectSite("fern");
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
